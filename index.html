<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HappyCapture</title>
<style>
  * { box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#000; color:#fff;
    font-family:-apple-system,system-ui,sans-serif; overflow:hidden; }
  #stage { position:fixed; inset:0; overflow:hidden; }
  #video { position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; transform-origin:center; will-change:transform; }
  #vignette { position:fixed; inset:0; pointer-events:none; opacity:0; display:none;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,.85) 100%);
    transition:opacity .3s; }
  #flash { position:fixed; inset:0; background:#fff; opacity:0;
    pointer-events:none; transition:opacity .15s; }
  #status { position:fixed; top:14px; left:0; right:0; text-align:center;
    font-size:12px; opacity:.85; line-height:1.5; padding:0 12px;
    pointer-events:none; text-shadow:0 1px 2px rgba(0,0,0,.6); }
  #hud { position:fixed; top:44px; left:50%; transform:translateX(-50%);
    width:180px; height:4px; border-radius:2px;
    background:rgba(255,255,255,.15); overflow:hidden; display:none; }
  #hud > div { height:100%; width:0; background:#ffcc00; border-radius:2px;
    transition:width .1s, background .1s; }
  #gallery { position:fixed; top:56px; left:0; right:0; height:64px;
    display:flex; gap:6px; padding:0 10px; overflow-x:auto;
    scrollbar-width:none; pointer-events:auto; }
  #gallery::-webkit-scrollbar { display:none; }
  #gallery .thumb { flex:0 0 auto; width:56px; height:56px; border-radius:8px;
    background:#1c1c1e center/cover no-repeat;
    border:1px solid rgba(255,255,255,.2); position:relative; overflow:hidden; }
  #gallery .thumb.video::after { content:'▶'; position:absolute;
    bottom:2px; right:4px; font-size:10px; color:#fff; text-shadow:0 0 3px #000; }
  #gallery .thumb.clear { display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.1); font-size:11px; border-style:dashed; }
  #ui { position:fixed; left:0; right:0; bottom:0; padding:18px 20px 28px;
    display:flex; justify-content:center; gap:22px; align-items:center; }
  button { border:none; border-radius:50%; background:#fff; width:70px; height:70px;
    font-size:13px; font-weight:700; color:#000; letter-spacing:.5px; }
  button.rec { background:#ff3b30; color:#fff; }
  button.fx, button.snap { width:56px; height:56px; font-size:11px;
    background:#1c1c1e; color:#fff; }
</style>
</head>
<body>
<div id="stage"><video id="video" autoplay playsinline muted></video></div>
<div id="vignette"></div>
<div id="status">Starting camera…</div>
<div id="hud"><div></div></div>
<div id="gallery"></div>
<div id="ui">
  <button id="fxBtn" class="fx">FX<br>Light</button>
  <button id="recBtn">REC</button>
  <button id="snapBtn" class="snap">PHOTO</button>
</div>
<div id="flash"></div>

<script type="module">
import { FaceLandmarker, FilesetResolver } from
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.12";

/* ---------- elements ---------- */
const video    = document.getElementById('video');
const statusEl = document.getElementById('status');
const recBtn   = document.getElementById('recBtn');
const fxBtn    = document.getElementById('fxBtn');
const snapBtn  = document.getElementById('snapBtn');
const flash    = document.getElementById('flash');
const vignette = document.getElementById('vignette');
const hud      = document.getElementById('hud');
const hudBar   = hud.firstElementChild;
const gallery  = document.getElementById('gallery');

/* ---------- config ---------- */
const ZOOM_MAX         = 2.5;
const SMILE_THRESHOLD  = 0.42;
const CORNER_LIFT      = 0.012;
const CAPTURE_COOLDOWN = 3000;
const CLIP_MS          = 4000;
const SHOW_TIMESTAMP   = true;
const MAX_GALLERY      = 20;

const PRESETS = {
  off:    { b:1.00, c:1.00, s:1.00, sepia:0.00, sharp:0.00, vig:0.00, label:'FX<br>Off'   },
  light:  { b:1.05, c:1.08, s:1.14, sepia:0.00, sharp:0.25, vig:0.18, label:'FX<br>Light' },
  strong: { b:1.10, c:1.18, s:1.30, sepia:0.06, sharp:0.55, vig:0.30, label:'FX<br>Strong'}
};

/* ---------- state ---------- */
let landmarker = null, stream = null;
let zoom = 1, zoomTarget = 1;
let nightBoost = 1;
let enhance = 'light';
let lastCapture = 0;
let lastVideoTime = -1;
let recording = false, manualRec = false, recorder = null, chunks = [];
let outCanvas, outCtx, recCrop = null, pumpRaf = 0;
let paused = false;
let sessionItems = [];

const ctxFilterOK = (() => {
  const c = document.createElement('canvas').getContext('2d');
  c.filter = 'brightness(0.5)';
  return c.filter === 'brightness(0.5)';
})();

/* ---------- preview ---------- */
function filterString() {
  const p = PRESETS[enhance];
  return `brightness(${(p.b*nightBoost).toFixed(3)}) contrast(${p.c}) saturate(${p.s}) sepia(${p.sepia})`;
}
function updatePreview() {
  const z = Math.max(zoom, 1).toFixed(3);
  video.style.transform = `scale(${-z}, ${z})`;
  video.style.filter    = filterString();
  const v = PRESETS[enhance].vig;
  vignette.style.display = v > 0 ? 'block' : 'none';
  vignette.style.opacity = v;
}

/* ---------- timestamp prerender ---------- */
const stampCache = { canvas: document.createElement('canvas'),
                     second:-1, w:0, h:0 };
function renderStamp(w, h) {
  if (!SHOW_TIMESTAMP) return;
  const sec = Math.floor(Date.now() / 1000);
  if (sec === stampCache.second && stampCache.w === w && stampCache.h === h) return;
  stampCache.second = sec; stampCache.w = w; stampCache.h = h;
  const c = stampCache.canvas;
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, w, h);
  const t = new Date().toLocaleString();
  const fs = Math.max(12, Math.round(h * 0.028));
  ctx.font = `${fs}px -apple-system, system-ui, sans-serif`;
  ctx.textBaseline = 'bottom';
  const tw = ctx.measureText(t).width;
  const padX = 8, padY = 6, boxW = tw + padX*2, boxH = fs + padY*2;
  const bx = w - boxW - 12, by = h - boxH - 12;
  ctx.fillStyle = 'rgba(0,0,0,.55)';
  ctx.fillRect(bx, by, boxW, boxH);
  ctx.fillStyle = 'rgba(255,255,255,.92)';
  ctx.fillText(t, bx + padX, by + boxH - padY);
}

/* ---------- camera ---------- */
async function startCamera() {
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode:'user', width:{ideal:1280}, height:{ideal:720} },
    audio: true
  });
  video.srcObject = stream;
  await video.play();
  statusEl.textContent = 'Loading face model…';
}

/* ---------- model ---------- */
async function startModel() {
  const fileset = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.12/wasm"
  );
  landmarker = await FaceLandmarker.createFromOptions(fileset, {
    baseOptions: {
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"
    },
    runningMode: "VIDEO",
    numFaces: 2
  });
  statusEl.textContent = 'Watching for smiles…';
  hud.style.display = 'block';
  requestAnimationFrame(detectLoop);
  setInterval(sampleNight, 1000);
}

/* ---------- night boost ---------- i */
const nightCanvas = Object.assign(document.createElement('canvas'),
                                  { width:64, height:36 });
const nightCtx = nightCanvas.getContext('2d', { willReadFrequently:true });
function sampleNight() {
  if (!video.videoWidth || paused) return;
  nightCtx.drawImage(video, 0, 0, 64, 36);
  const d = nightCtx.getImageData(0, 0, 64, 36).data;
  let sum = 0;
  for (let = 0; i < d.length; i += 4)
    sum += 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
  const mean = sum / (64*36);
  const target = mean < 70 ? Math.min(1.4, 1 + (70 - mean)/120) : 1;
  nightBoost += (target - nightBoost) * 0.5;
  updatePreview();
}

/* ---------- detection ---------- */
const ML = 61, MR = 291, MU = 13, MD = 14;

function detectLoop() {
  requestAnimationFrame(detectLoop);
  if (paused || !landmarker || video.readyState < 2) return;
  if (video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;

  const t = performance.now();
  let res;
  try { res = landmarker.detectForVideo(video, t); }
  catch { return; }

  if (!res.faceLandmarks?.length) {
    zoomTarget = 1; smoothZoom();
    hudBar.style.width = '0%';
    return;
  }

  let best = null, bestArea = 0, bx = 0;
  for (const lm of res.faceLandmarks) {
    let minX=1, minY=1, maxX=0, maxY=0;
    for (const p of lm) {
      if (p.x<minX) minX=p.x; if (p.x>maxX) maxX=p.x;
      if (p.y<minY) minY=p.y; if (p.y>maxY) maxY=p.y;
    }
    const area = (maxX-minX)*(maxY-minY);
    if (area > bestArea) { bestArea = area; best = lm; bx = maxX-minX; }
  }
  zoomTarget = bestArea > 0.15 ? 1.0 : bestArea > 0.05 ? 1.8 : 2.5;
  smoothZoom();
  if (!best) return;

  const L = best[ML], R = best[MR], U = best[MU], D = best[MD];
  const mouthW  = Math.hypot(R.x - L.x, R.y - L.y);
  const cornerY = (L.y + R.y) / 2;
  const mouthCY = (U.y + D.y) / 2;
  const lift    = mouthCY - cornerY;
  const widthR  = mouthW / (bx + 1e-6);
  const score   = Math.min(1, Math.max(0, (widthR - 0.30) / 0.20));

  hudBar.style.width = (score*100).toFixed(0) + '%';
  hudBar.style.background = score >= SMILE_THRESHOLD ? '#34c759' : '#ffcc00';

  if (score >= SMILE_THRESHOLD && lift > CORNER_LIFT &&
      t - lastCapture > CAPTURE_COOLDOWN) {
    lastCapture = t;
    triggerCapture();
  }
}
function smoothZoom() {
  const clamped = Math.min(zoomTarget, ZOOM_MAX);
  zoom += (clamped - zoom) * 0.12;
  updatePreview();
}

/* ---------- crop ---------- */
function cropFor(z) {
  const vw = video.videoWidth, vh = video.videoHeight;
  const sw = vw / z, sh = vh / z;
  return { sx:(vw-sw)/2, sy:(vh-sh)/2, sw, sh };
}

/* ---------- still pipeline ---------- */
function enhanceCanvasManually(canvas, p) {
  const ctx = canvas.getContext('2d', { willReadFrequently:true });
  const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const d = img.data;
  const lut = new Uint8ClampedArray(256);
  const b = p.b * nightBoost;
  for (let i = 0; i < 256; i++) {
    let v = (i/255) * b;
    v = (v - 0.5) * p.c + 0.5;
    lut[i] = Math.max(0, Math.min(255, v*255));
  }
  for (let i = 0; i < d.length; i += 4) {
    const r = lut[d[i]], g = lut[d[i+1]], bl = lut[d[i+2]];
    const l = 0.299*r + 0.587*g + 0.114*bl;
    d[i]   = l + (r - l)*p.s;
    d[i+1] = l + (g - l)*p.s;
    d[i+2] = l + (bl - l)*p.s;
  }
  ctx.putImageData(img, 0, 0);
}
function sharpen(canvas, ctx, amount) {
  const w = canvas.width, h = canvas.height;
  const img = ctx.getImageData(0, 0, w, h);
  const src = img.data;
  const out = ctx.createImageData(w, h);
  const dst = out.data;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = (y*w + x) * 4;
      let r=0,g=0,b=0,n=0;
      for (let dy=-1; dy<=1; dy++) {
        const yy=y+dy; if (yy<0||yy>=h) continue;
        for (let dx=-1; dx<=1; dx++) {
          const xx=x+dx; if (xx<0||xx>=w) continue;
          const j=(yy*w+xx)*4; r+=src[j]; g+=src[j+1]; b+=src[j+2]; n++;
        }
      }
      r/=n; g/=n; b/=n;
      dst[i]   = src[i]   + (src[i]   - r)*amount;
      dst[i+1] = src[i+1] + (src[i+1] - g)*amount;
      dst[i+2] = src[i+2] + (src[i+2] - b)*amount;
      dst[i+3] = 255;
    }
  }
  ctx.putImageData(out, 0, 0);
}
function captureStill() {
  const p = PRESETS[enhance];
  const { sx, sy, sw, sh } = cropFor(Math.max(zoom, 1));
  const c = document.createElement('canvas');
  c.width = Math.round(sw); c.height = Math.round(sh);
  const ctx = c.getContext('2d', { willReadFrequently:true });
  if (ctxFilterOK) ctx.filter = filterString();
  ctx.save();
  ctx.translate(c.width, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, c.width, c.height);
  ctx.restore();
  ctx.filter = 'none';
  if (!ctxFilterOK) enhanceCanvasManually(c, p);
  if (p.sharp > 0)  sharpen(c, ctx, p.sharp);
  if (SHOW_TIMESTAMP) { renderStamp(c.width, c.height); ctx.drawImage(stampCache.canvas, 0, 0); }
  return c;
}

/* ---------- recording ---------- */
function pumpFrame() {
  if (!recording) return;
  const { sx, sy, sw, sh } = recCrop;
  if (ctxFilterOK) outCtx.filter = filterString();
  outCtx.save();
  outCtx.translate(outCanvas.width, 0);
  outCtx.scale(-1, 1);
  outCtx.drawImage(video, sx, sy, sw, sh, 0, 0, outCanvas.width, outCanvas.height);
  outCtx.restore();
  outCtx.filter = 'none';
  if (SHOW_TIMESTAMP) {
    renderStamp(outCanvas.width, outCanvas.height);
    outCtx.drawImage(stampCache.canvas, 0, 0);
  }
  pumpRaf = requestAnimationFrame(pumpFrame);
}
function startRecording(ms) {
  if (recording) return;
  const { sx, sy, sw, sh } = cropFor(Math.max(zoom, 1));
  recCrop = { sx, sy, sw, sh };
  outCanvas = document.createElement('canvas');
  outCanvas.width  = Math.min(1280, Math.round(sw));
  outCanvas.height = Math.round(outCanvas.width * (sh / sw));
  outCtx = outCanvas.getContext('2d');

  const vStream = outCanvas.captureStream(30);
  const aTrack = stream.getAudioTracks()[0];
  if (aTrack) vStream.addTrack(aTrack);

  const mime = MediaRecorder.isTypeSupported('video/mp4') ? 'video/mp4'
    : (MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9'
    : 'video/webm');

  chunks = [];
  recorder = new MediaRecorder(vStream, { mimeType: mime, videoBitsPerSecond: 6_000_000 });
  recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: mime });
    const ext  = mime.includes('mp4') ? 'mp4' : 'webm';
    addToGallery(blob, 'video', ext);
    recording = false; manualRec = false; recorder = null;
    recBtn.classList.remove('rec');
    cancelAnimationFrame(pumpRaf);
  };
  recorder.start();
  recording = true;
  recBtn.classList.add('rec');
  pumpFrame();
  if (ms > 0) setTimeout(() => {
    if (recording && !manualRec && recorder && recorder.state !== 'inactive') recorder.stop();
  }, ms);
}

/* ---------- gallery ---------- */
function addToGallery(blob, type, ext) {
  const url  = URL.createObjectURL(blob);
  const item = { blob, url, type, ext };
  sessionItems.push(item);

  const el = document.createElement('div');
  el.className = 'thumb' + (type === 'video' ? ' video' : '');
  if (type === 'photo') el.style.backgroundImage = `url(${url})`;
  el.dataset.url = url;
  el.onclick = () => saveBlob(item);
  gallery.insertBefore(el, gallery.firstChild);

  if (sessionItems.length > MAX_GALLERY) {
    const old = sessionItems.shift();
    URL.revokeObjectURL(old.url);
    const oel = gallery.querySelector(`[data-url="${CSS.escape(old.url)}"]`);
    if (oel) oel.remove();
  }
  if (!gallery.querySelector('.clear')) {
    const cl = document.createElement('div');
    cl.className = 'thumb clear';
    cl.textContent = 'Clear';
    cl.onclick = e => {
      e.stopPropagation();
      sessionItems.forEach(i => URL.revokeObjectURL(i.url));
      sessionItems = [];
      gallery.innerHTML = '';
    };
    gallery.appendChild(cl);
  }
}
async function saveBlob(item) {
  const filename = `happy-${Date.now()}.${item.ext}`;
  const file = new File([item.blob], filename, { type: item.blob.type });
  if (navigator.canShare && navigator.canShare({ files:[file] })) {
    try { await navigator.share({ files:[file] }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = item.url; a.download = filename; a.click();
}

/* ---------- trigger ---------- */
function triggerCapture() {
  flash.style.opacity = 0.9;
  setTimeout(() => flash.style.opacity = 0, 120);
  const canvas = captureStill();
  canvas.toBlob(blob => {
    if (!blob) return;
    addToGallery(blob, 'photo', 'jpg');
    if (!recording) startRecording(CLIP_MS);
  }, 'image/jpeg', 0.94);
}

/* ---------- UI ---------- */
recBtn.onclick = () => {
  if (recording) {
    manualRec = false;
    if (recorder && recorder.state !== 'inactive') recorder.stop();
    return;
  }
  manualRec = true;
  startRecording(0);
};
snapBtn.onclick = () => triggerCapture();

const order = ['off', 'light', 'strong'];
fxBtn.onclick = () => {
  enhance = order[(order.indexOf(enhance) + 1) % order.length];
  fxBtn.innerHTML = PRESETS[enhance].label;
  updatePreview();
};

document.addEventListener('visibilitychange', () => {
  paused = document.hidden;
  if (paused && recording && recorder && recorder.state !== 'inactive') {
    manualRec = false;
    recorder.stop();
  }
});

/* ---------- boot ---------- */
(async () => {
  try {
    await startCamera();
    updatePreview();
    await startModel();
  } catch (e) {
    statusEl.textContent = 'Error: ' + (e?.message || e);
  }
})();
</script>
</body>
</html>
